<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SignMate AI 수어 인식 처리 흐름</title><desc id="desc">카메라 영상에서 손을 감지하고 손 좌표를 추출해 수어를 예측하여 사용자에게 결과를 보여주는 처리 흐름</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f3fcf7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#183153" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#398b70"/></marker><style>.title{font:700 46px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#183153}.sub{font:400 22px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#5e7085}.head{font:700 24px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#183153}.body{font:400 18px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#506174}.num{font:700 18px Arial,sans-serif;fill:#fff}.line{stroke:#398b70;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="84" text-anchor="middle" class="title">AI 수어 인식 처리 흐름</text><text x="800" y="124" text-anchor="middle" class="sub">실시간 영상에서 손의 특징을 분석하여 수어를 예측합니다.</text>
  <g filter="url(#shadow)"><rect x="80" y="300" width="210" height="235" rx="28" fill="#fff" stroke="#d7e6df" stroke-width="2"/><rect x="370" y="300" width="210" height="235" rx="28" fill="#fff" stroke="#d7e6df" stroke-width="2"/><rect x="660" y="300" width="210" height="235" rx="28" fill="#fff" stroke="#d7e6df" stroke-width="2"/><rect x="950" y="300" width="210" height="235" rx="28" fill="#fff" stroke="#d7e6df" stroke-width="2"/><rect x="1240" y="300" width="280" height="235" rx="28" fill="#fff" stroke="#d7e6df" stroke-width="2"/></g>
  <g><circle cx="115" cy="336" r="19" fill="#398b70"/><text x="115" y="343" text-anchor="middle" class="num">1</text><text x="185" y="398" text-anchor="middle" class="head">카메라 영상</text><text x="185" y="432" text-anchor="middle" class="body">사용자가 수어를</text><text x="185" y="459" text-anchor="middle" class="body">카메라 앞에서 표현</text></g>
  <g><circle cx="405" cy="336" r="19" fill="#398b70"/><text x="405" y="343" text-anchor="middle" class="num">2</text><text x="475" y="398" text-anchor="middle" class="head">손 감지</text><text x="475" y="432" text-anchor="middle" class="body">MediaPipe가 손을</text><text x="475" y="459" text-anchor="middle" class="body">최대 두 개까지 감지</text></g>
  <g><circle cx="695" cy="336" r="19" fill="#398b70"/><text x="695" y="343" text-anchor="middle" class="num">3</text><text x="765" y="398" text-anchor="middle" class="head">랜드마크 추출</text><text x="765" y="432" text-anchor="middle" class="body">한 손당 21개 관절</text><text x="765" y="459" text-anchor="middle" class="body">x·y·z 좌표 추출</text></g>
  <g><circle cx="985" cy="336" r="19" fill="#398b70"/><text x="985" y="343" text-anchor="middle" class="num">4</text><text x="1055" y="398" text-anchor="middle" class="head">수어 분류</text><text x="1055" y="432" text-anchor="middle" class="body">양손 126개 특징값을</text><text x="1055" y="459" text-anchor="middle" class="body">분류 모델에 입력</text></g>
  <g><circle cx="1275" cy="336" r="19" fill="#398b70"/><text x="1275" y="343" text-anchor="middle" class="num">5</text><text x="1380" y="389" text-anchor="middle" class="head">결과 안정화·표시</text><text x="1380" y="426" text-anchor="middle" class="body">최근 12프레임 평균화</text><text x="1380" y="453" text-anchor="middle" class="body">신뢰도 70% 이상 판정</text><text x="1380" y="485" text-anchor="middle" class="body">수어 이름·정답 여부 표시</text></g>
  <path d="M290 417H355M580 417H645M870 417H935M1160 417H1225" class="line"/>
  <rect x="290" y="650" width="1020" height="105" rx="24" fill="#e5f5ec" stroke="#a7d9c0" stroke-width="2"/><text x="800" y="696" text-anchor="middle" class="head">핵심 설계: 영상 저장 없이 브라우저 내부에서 추론 수행</text><text x="800" y="731" text-anchor="middle" class="body">서버 전송 부담과 개인정보 노출 가능성을 줄이고, 모바일 환경에서도 즉시 사용할 수 있도록 구성하였습니다.</text>
</svg>
